name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo. The token below is used solely to
# raise the GitHub API rate limit for release-binary version lookups.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh + shellcheck
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - name: shellcheck (shell scripts)
        run: |
          shellcheck --severity=warning --shell=bash install.sh uninstall.sh scripts/*.sh
          # bootstrap.sh is POSIX sh on purpose — it runs before bash is guaranteed
          shellcheck --severity=warning --shell=sh bootstrap.sh
      - name: bash -n (install.sh) / sh -n (bootstrap.sh)
        run: |
          bash -n install.sh
          sh   -n bootstrap.sh
          dash -n bootstrap.sh   # stricter POSIX parse than bash-as-sh
      - name: zsh -n (zsh configs)
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/aliases.zsh
      - name: Validate TOML (starship + alacritty)
        run: |
          python3 -c "import tomllib; tomllib.load(open('starship/starship.toml','rb'))"
          python3 -c "import tomllib; tomllib.load(open('alacritty/alacritty.toml','rb'))"
      - name: Validate git-delta fragment
        run: git config -f git/delta.gitconfig --list
      - name: --dry-run and --doctor exit 0 and touch nothing
        run: |
          # run against an isolated empty HOME so any stray write is detectable
          h="$(mktemp -d)"
          HOME="$h" ./install.sh --dry-run -y --no-chsh >/dev/null
          HOME="$h" ./install.sh --doctor              >/dev/null
          n="$(find "$h" -mindepth 1 | wc -l)"
          [ "$n" -eq 0 ] || { echo "::error::--dry-run/--doctor wrote $n entries to \$HOME"; find "$h" -mindepth 1; exit 1; }
          echo "✓ dry-run + doctor: exit 0, zero writes"
      - name: Lua parse (nvim config)
        run: |
          sudo apt-get install -y lua5.4 || sudo apt-get install -y lua5.3 || true
          for f in $(find nvim -name '*.lua'); do luac5.4 -p "$f" || luac5.3 -p "$f" || echo "skip $f"; done

  smoke:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates zsh
            args: --minimal --no-chsh -y
          - name: fedora
            image: fedora:latest
            prep: dnf install -y sudo git curl zsh
            args: --minimal --no-chsh -y
          - name: arch
            image: archlinux:latest
            prep: pacman -Sy --noconfirm sudo git curl zsh
            args: --minimal --no-chsh -y
          - name: ubuntu-offline
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates zsh
            args: --offline --minimal --no-chsh -y
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test on ${{ matrix.name }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "${{ matrix.image }}" bash -ec '
            ${{ matrix.prep }}
            ./install.sh ${{ matrix.args }}
            # `test … && echo` cannot fail a job under set -e (the failing command is
            # not the last of the AND-list, so it is exempt) — assert with || exit
            test -L "$HOME/.zshrc"                || { echo "::error::~/.zshrc not symlinked";      exit 1; }
            test -L "$HOME/.config/starship.toml" || { echo "::error::starship.toml not symlinked"; exit 1; }
            zsh -ic "exit 0"                      || { echo "::error::interactive zsh failed";      exit 1; }
            echo "smoke OK on ${{ matrix.name }}"
          '

  # macOS is a first-class target (brew path, casks, no gcc/make, chsh skip) —
  # exercise it for real on a GitHub macOS runner, which ships Homebrew.
  macos:
    needs: lint
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
      - name: --dry-run and --doctor exit 0 and touch nothing (brew path)
        run: |
          h="$(mktemp -d)"
          HOME="$h" ./install.sh --dry-run -y --no-chsh >/dev/null
          HOME="$h" ./install.sh --doctor              >/dev/null
          n="$(find "$h" -mindepth 1 | wc -l | tr -d ' ')"
          [ "$n" -eq 0 ] || { echo "::error::--dry-run/--doctor wrote $n entries to \$HOME"; find "$h" -mindepth 1; exit 1; }
          echo "✓ dry-run + doctor: exit 0, zero writes"
      - name: Minimal install on macOS
        run: |
          ./install.sh --minimal --no-chsh -y
          test -L "$HOME/.zshrc"                || { echo "::error::~/.zshrc not symlinked";      exit 1; }
          test -L "$HOME/.config/starship.toml" || { echo "::error::starship.toml not symlinked"; exit 1; }
          zsh -ic "exit 0"                      || { echo "::error::interactive zsh failed";      exit 1; }
          echo "smoke OK on macOS"

  bootstrap:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu:24.04
          - name: fedora
            image: fedora:latest
          - name: arch
            image: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      # The whole point of bootstrap.sh is a box with NO git: you can't clone the
      # repo that holds install.sh. These base images ship without git, so there is
      # deliberately no prep step here — bootstrap has to install git itself, clone,
      # and hand off to install.sh. Ubuntu also runs this under dash, not bash.
      - name: Bootstrap a git-less ${{ matrix.name }}
        run: |
          docker run --rm -v "$PWD:/repo" "${{ matrix.image }}" sh -ec '
            # assertions use `|| { …; exit 1; }` — a bare `test … && echo` cannot
            # fail the job under set -e, so it would assert nothing
            if command -v git >/dev/null; then
              echo "::error::${{ matrix.image }} now ships git — this job no longer proves anything; uninstall git here or drop the distro"
              exit 1
            fi
            cp -r /repo /root/src   # root-owned copy: sidesteps git safe.directory on the mount
            sh /root/src/bootstrap.sh --repo /root/src --dir /root/console --minimal --no-chsh -y
            command -v git >/dev/null  || { echo "::error::bootstrap did not install git";      exit 1; }
            test -d /root/console/.git || { echo "::error::bootstrap did not clone the repo";   exit 1; }
            test -L "$HOME/.zshrc"     || { echo "::error::install.sh never ran (no ~/.zshrc)"; exit 1; }
            echo "bootstrap OK on ${{ matrix.name }}"
          '

  extras:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates zsh
          - name: fedora
            image: fedora:latest
            prep: dnf install -y sudo git curl zsh
          - name: arch
            image: archlinux:latest
            prep: pacman -Sy --noconfirm sudo git curl zsh
    steps:
      - uses: actions/checkout@v7
      # Non-minimal install (minus the slow nvim + font) so the extras path is
      # actually exercised: pass, fabric (SHA256-verified GitHub release),
      # tmux-sessionizer symlink, and the fzf preview opts. Asserted by
      # scripts/ci-extras-check.sh (fabric is a soft check — network dependent).
      - name: Extras + uninstall on ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}   # authenticated API calls → no rate limit
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/repo" -w /repo "${{ matrix.image }}" bash -ec '
            ${{ matrix.prep }}
            echo PRE-INSTALL-MARKER > "$HOME/.zshrc"   # exercise the pre-change backup
            ./install.sh --no-nvim --no-font --no-chsh -y
            bash scripts/ci-extras-check.sh ${{ matrix.name }}
            ./uninstall.sh
            bash scripts/ci-uninstall-check.sh ${{ matrix.name }}
          '
