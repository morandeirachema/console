name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo. The token below is used solely to
# raise the GitHub API rate limit for release-binary version lookups.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # the checkout is bind-mounted into containers that run the PR's own scripts
      - name: Install zsh + shellcheck
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - name: shellcheck (shell scripts)
        run: |
          shellcheck --severity=warning --shell=bash install.sh uninstall.sh scripts/*.sh
          # bootstrap.sh is POSIX sh on purpose — it runs before bash is guaranteed
          shellcheck --severity=warning --shell=sh bootstrap.sh
      - name: bash -n (install.sh) / sh -n (bootstrap.sh)
        run: |
          bash -n install.sh
          bash -n scripts/sesh-picker.sh scripts/tmux-sessionizer.sh scripts/nas-sync.sh
          sh   -n bootstrap.sh
          dash -n bootstrap.sh   # stricter POSIX parse than bash-as-sh
      - name: zsh -n (zsh configs)
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/aliases.zsh
      - name: Validate TOML (starship + alacritty + atuin + sesh + superfile)
        run: |
          python3 -c "import tomllib; tomllib.load(open('starship/starship.toml','rb'))"
          python3 -c "import tomllib; tomllib.load(open('alacritty/alacritty.toml','rb'))"
          python3 -c "import tomllib; tomllib.load(open('atuin/config.toml','rb'))"
          python3 -c "import tomllib; tomllib.load(open('sesh/sesh.toml','rb'))"
          python3 -c "import tomllib; tomllib.load(open('superfile/config.toml','rb'))"
      - name: Validate ghostty config (key = value lint; full check only if ghostty is present)
        run: |
          if grep -vE '^\s*(#|$)' ghostty/config | grep -vE '^[a-z-]+ = .+$'; then
            echo "ghostty/config: lines above are not 'key = value'"; exit 1; fi
          # the flag only accepts the --flag=value form; skip (don't mask) when ghostty is absent
          if command -v ghostty >/dev/null; then ghostty +validate-config --config-file=ghostty/config; fi
      - name: Validate git-delta fragment
        run: git config -f git/delta.gitconfig --list
      - name: --dry-run and --doctor exit 0 and touch nothing
        run: |
          # run against an isolated empty HOME so any stray write is detectable
          h="$(mktemp -d)"
          HOME="$h" ./install.sh --dry-run -y --no-chsh >/dev/null
          # an empty HOME has nothing linked, so --doctor must report problems (exit 1), not crash
          HOME="$h" ./install.sh --doctor >/dev/null; rc=$?; [ "$rc" -eq 1 ] || { echo "doctor exit $rc, expected 1"; exit 1; }
          HOME="$h" ./uninstall.sh --dry-run >/dev/null
          n="$(find "$h" -mindepth 1 | wc -l)"
          [ "$n" -eq 0 ] || { echo "::error::--dry-run/--doctor wrote $n entries to \$HOME"; find "$h" -mindepth 1; exit 1; }
          echo "✓ dry-run + doctor: exit 0, zero writes"
      - name: Release helpers refuse a bad checksum (offline unit test)
        run: bash scripts/ci-checksum-check.sh
      - name: markdownlint (docs)
        # pinned so a new release's rules can't turn CI red without a docs change
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md" "#node_modules"
      - name: Lua parse (nvim config)
        run: |
          sudo apt-get install -y lua5.4
          find nvim -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

  smoke:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates zsh
            args: --minimal --no-chsh -y
            zshrc: /root/.zshrc
          - name: fedora
            image: fedora:latest
            prep: dnf install -y sudo git curl zsh
            args: --minimal --no-chsh -y
            zshrc: /root/.zshrc
          - name: arch
            image: archlinux:latest
            prep: pacman -Sy --noconfirm sudo git curl zsh
            args: --minimal --no-chsh -y
            zshrc: /root/.zshrc
          - name: opensuse
            image: opensuse/tumbleweed:latest
            prep: zypper -n install sudo git curl zsh
            args: --minimal --no-chsh -y
            zshrc: /root/.zshrc
          - name: ubuntu-xdg
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates zsh
            args: --minimal --xdg --no-chsh -y
            zshrc: /root/.config/zsh/.zshrc
            # --xdg must add exactly one ZDOTDIR line, stay idempotent, and be fully reversible
            post: |
              [ "$(grep -c 'export ZDOTDIR=' "$HOME/.zshenv")" -eq 1 ] || { echo "::error::ZDOTDIR line count"; exit 1; }
              ./install.sh --minimal --xdg --no-chsh -y >/dev/null
              [ "$(grep -c 'export ZDOTDIR=' "$HOME/.zshenv")" -eq 1 ] || { echo "::error::ZDOTDIR duplicated on re-run"; exit 1; }
              ./uninstall.sh >/dev/null
              ! grep -q ZDOTDIR "$HOME/.zshenv" || { echo "::error::uninstall left the ZDOTDIR line"; exit 1; }
              ! test -e "$HOME/.config/zsh/.zshrc" || { echo "::error::uninstall left the --xdg .zshrc"; exit 1; }
              echo "xdg lifecycle OK"
          - name: ubuntu-offline
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates zsh
            # every outbound connection is refused, so this leg PROVES --offline makes no fetch
            pre: export http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.proxy GIT_CONFIG_VALUE_0=http://127.0.0.1:9
            args: --offline --minimal --no-chsh -y
            zshrc: /root/.zshrc
            zshcheck: --offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # the checkout is bind-mounted into containers that run the PR's own scripts
      - name: Smoke test on ${{ matrix.name }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "${{ matrix.image }}" bash -ec '
            ${{ matrix.prep }}
            ${{ matrix.pre }}
            ./install.sh ${{ matrix.args }}
            # `test … && echo` cannot fail a job under set -e (the failing command is
            # not the last of the AND-list, so it is exempt) — assert with || exit
            test -L "${{ matrix.zshrc }}"         || { echo "::error::${{ matrix.zshrc }} not symlinked"; exit 1; }
            test -L "$HOME/.config/starship.toml" || { echo "::error::starship.toml not symlinked"; exit 1; }
            # the shell must really start: zinit cloned, turbo plugins loaded, bindings present
            bash scripts/ci-zsh-check.sh ${{ matrix.zshcheck }} || { echo "::error::interactive zsh check failed"; exit 1; }
            ${{ matrix.post }}
            echo "smoke OK on ${{ matrix.name }}"
          '

  # macOS is a first-class target (brew path, casks, no gcc/make, chsh skip) —
  # exercise it for real on a GitHub macOS runner, which ships Homebrew.
  macos:
    needs: lint
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # the checkout is bind-mounted into containers that run the PR's own scripts
      - name: --dry-run and --doctor exit 0 and touch nothing (brew path)
        run: |
          h="$(mktemp -d)"
          HOME="$h" ./install.sh --dry-run -y --no-chsh >/dev/null
          # an empty HOME has nothing linked, so --doctor must report problems (exit 1), not crash
          HOME="$h" ./install.sh --doctor >/dev/null; rc=$?; [ "$rc" -eq 1 ] || { echo "doctor exit $rc, expected 1"; exit 1; }
          HOME="$h" ./uninstall.sh --dry-run >/dev/null
          n="$(find "$h" -mindepth 1 | wc -l | tr -d ' ')"
          [ "$n" -eq 0 ] || { echo "::error::--dry-run/--doctor wrote $n entries to \$HOME"; find "$h" -mindepth 1; exit 1; }
          echo "✓ dry-run + doctor: exit 0, zero writes"
      - name: Minimal install on macOS
        run: |
          ./install.sh --minimal --no-chsh -y
          test -L "$HOME/.zshrc"                || { echo "::error::~/.zshrc not symlinked";      exit 1; }
          test -L "$HOME/.config/starship.toml" || { echo "::error::starship.toml not symlinked"; exit 1; }
          bash scripts/ci-zsh-check.sh          || { echo "::error::interactive zsh check failed"; exit 1; }
          echo "smoke OK on macOS"

  bootstrap:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu:24.04
          - name: fedora
            image: fedora:latest
          - name: arch
            image: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # the checkout is bind-mounted into containers that run the PR's own scripts
      # The whole point of bootstrap.sh is a box with NO git: you can't clone the
      # repo that holds install.sh. These base images ship without git, so there is
      # deliberately no prep step here — bootstrap has to install git itself, clone,
      # and hand off to install.sh. Ubuntu also runs this under dash, not bash.
      - name: Bootstrap a git-less ${{ matrix.name }}
        run: |
          docker run --rm -v "$PWD:/repo" "${{ matrix.image }}" sh -ec '
            # assertions use `|| { …; exit 1; }` — a bare `test … && echo` cannot
            # fail the job under set -e, so it would assert nothing
            if command -v git >/dev/null; then
              echo "::error::${{ matrix.image }} now ships git — this job no longer proves anything; uninstall git here or drop the distro"
              exit 1
            fi
            cp -r /repo /root/src   # root-owned copy: sidesteps git safe.directory on the mount
            sh /root/src/bootstrap.sh --repo /root/src --dir /root/console --minimal --no-chsh -y
            command -v git >/dev/null  || { echo "::error::bootstrap did not install git";      exit 1; }
            test -d /root/console/.git || { echo "::error::bootstrap did not clone the repo";   exit 1; }
            test -L "$HOME/.zshrc"     || { echo "::error::install.sh never ran (no ~/.zshrc)"; exit 1; }
            echo "bootstrap OK on ${{ matrix.name }}"
          '

  extras:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu:24.04
            prep: apt-get update && apt-get install -y sudo git curl ca-certificates zsh
          - name: fedora
            image: fedora:latest
            prep: dnf install -y sudo git curl zsh
          - name: arch
            image: archlinux:latest
            prep: pacman -Sy --noconfirm sudo git curl zsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # the checkout is bind-mounted into containers that run the PR's own scripts
      # Non-minimal install (minus the slow nvim + font) so the extras path is
      # actually exercised: pass, fabric (SHA256-verified GitHub release),
      # tmux-sessionizer symlink, and the fzf preview opts. Asserted by
      # scripts/ci-extras-check.sh (fabric is a soft check — network dependent).
      - name: Extras + uninstall on ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}   # authenticated API calls → no rate limit
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/repo" -w /repo "${{ matrix.image }}" bash -ec '
            ${{ matrix.prep }}
            echo PRE-INSTALL-MARKER > "$HOME/.zshrc"   # exercise the pre-change backup
            ./install.sh --no-nvim --no-font --no-chsh -y
            bash scripts/ci-extras-check.sh ${{ matrix.name }}
            bash scripts/ci-zsh-check.sh
            # second run idempotent, tmux/sesh-picker wired, uninstall twice, restore recipe
            bash scripts/ci-lifecycle-check.sh ${{ matrix.name }} --no-nvim --no-font --no-chsh -y
          '
