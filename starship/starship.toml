# Starship prompt — rounded "pill" segments (Catppuccin Mocha palette).
# Requires a Nerd Font: https://www.nerdfonts.com/
# Each segment is a self-contained capsule, so empty ones vanish cleanly.
# Config reference: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "console"

format = """
$username\
$hostname\
$os\
$directory\
$git_branch\
$git_status\
$nodejs$python$rust$golang$java$php$c\
$docker_context\
$kubernetes\
$aws\
$line_break\
$character"""

# right side of each prompt: how long the last command took + the time it finished
right_format = """$cmd_duration$time"""

# Catppuccin Mocha — https://github.com/catppuccin/catppuccin
[palettes.console]
crust    = "#11111b"   # dark text on bright pills
text_lt  = "#cdd6f4"   # light text on dark pills
os_bg    = "#45475a"   # surface1
dir      = "#89b4fa"   # blue
git      = "#a6e3a1"   # green
warn     = "#f9e2af"   # yellow  (dirty git)
lang     = "#94e2d5"   # teal
meta     = "#cba6f7"   # mauve   (docker)
dur      = "#585b70"   # surface2 (command time)
muted    = "#6c7086"   # overlay0
peach    = "#fab387"   # elapsed time of last command
subtext  = "#a6adc8"   # timestamp
sky      = "#89dceb"   # username (remote / unusual user)
root     = "#f38ba8"   # root user — danger
host     = "#eba0ac"   # ssh hostname
k8s      = "#74c7ec"   # kubernetes context
cloud    = "#f2cdcd"   # aws profile / region

# --- session identity: WHO and WHERE, so you never run a command on the
#     wrong box. Hidden in a normal local shell; appears over SSH / as root. ---
[username]
show_always = false            # shown when root, over SSH, or an unusual $USER
style_user = "bold fg:sky"
style_root = "bold fg:root"
format = "[$user]($style)"

[hostname]
ssh_only = true                # only when connected over SSH
trim_at = "."                  # strip the domain, keep the short hostname
style = "bold fg:host"
format = "[@$hostname ]($style)"

[os]
disabled = false
style = "fg:text_lt bg:os_bg"
format = "[](fg:os_bg)[$symbol]($style)[](fg:os_bg) "
[os.symbols]
Ubuntu  = "󰕈"
Debian  = ""
Arch    = ""
Fedora  = ""
Alpine  = ""
Linux   = ""
Macos   = ""
Windows = ""

[directory]
style = "fg:crust bg:dir"
format = "[](fg:dir)[  $path$read_only ]($style)[](fg:dir) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "
repo_root_style = "bold fg:crust bg:dir"       # highlight the repo-root folder
before_repo_root_style = "fg:crust bg:dir"
read_only_style = "fg:crust bg:dir"
# Inside a git repo starship renders repo_root_format INSTEAD of format — it needs the same
# caps and icon, or the pill loses them exactly where you look at it most.
repo_root_format = "[](fg:dir)[  $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only]($read_only_style)[](fg:dir) "
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Pictures"  = " "
"Music"     = " "
"Videos"    = " "
"Projects"  = " "
"code"      = " "
".config"   = " "

[git_branch]
symbol = ""
style = "fg:crust bg:git"
format = "[](fg:git)[ $symbol ]($style)[$branch ](bold fg:crust bg:git)[](fg:git) "

[git_status]
style = "fg:crust bg:warn"
format = "([](fg:warn)[ $all_status$ahead_behind ]($style)[](fg:warn) )"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?${count}"
modified  = "!${count}"
staged    = "+${count}"
renamed   = "»${count}"
deleted   = "✘${count}"
stashed   = "≡"

[nodejs]
symbol = ""
style = "fg:crust bg:lang"
format = "[](fg:lang)[ $symbol $version ]($style)[](fg:lang) "
[python]
symbol = ""
style = "fg:crust bg:lang"
format = "[](fg:lang)[ $symbol $version ]($style)[](fg:lang) "
[rust]
symbol = ""
style = "fg:crust bg:lang"
format = "[](fg:lang)[ $symbol $version ]($style)[](fg:lang) "
[golang]
symbol = ""
style = "fg:crust bg:lang"
format = "[](fg:lang)[ $symbol $version ]($style)[](fg:lang) "
[java]
symbol = ""
style = "fg:crust bg:lang"
format = "[](fg:lang)[ $symbol $version ]($style)[](fg:lang) "
[php]
symbol = ""
style = "fg:crust bg:lang"
format = "[](fg:lang)[ $symbol $version ]($style)[](fg:lang) "
[c]
symbol = ""
style = "fg:crust bg:lang"
format = "[](fg:lang)[ $symbol $version ]($style)[](fg:lang) "

[docker_context]
symbol = ""
style = "fg:crust bg:meta"
format = "[](fg:meta)[ $symbol $context ]($style)[](fg:meta) "
only_with_files = true

# --- infra context: which cluster / cloud account you're pointed at.
#     Only render when a context is actually set. ---
[kubernetes]
disabled = false
# Always shown by default (safety). To show it only inside infra/k8s dirs,
# uncomment any of these detect_* filters:
# detect_files = ['Chart.yaml', 'skaffold.yaml', 'kustomization.yaml']
# detect_folders = ['helm', 'k8s', 'manifests']
# detect_extensions = ['tf']
symbol = "☸ "
style = "fg:crust bg:k8s"
format = "[](fg:k8s)[ $symbol$context(:$namespace) ]($style)[](fg:k8s) "

[aws]
symbol = " "
style = "fg:crust bg:cloud"
format = "[](fg:cloud)[ $symbol$profile( $region) ]($style)[](fg:cloud) "

[cmd_duration]
min_time = 0                 # show the elapsed time for every command
show_milliseconds = true     # ...including sub-second ones (e.g. 42ms)
style = "fg:peach"
format = "[  $duration]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:subtext"
format = "[   $time]($style)"

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"
vicmd_symbol = "[❮](bold #a6e3a1)"
